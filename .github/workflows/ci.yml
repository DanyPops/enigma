name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test
        env:
          # macOS-only: proves the Keychain adapter reports "locked" distinctly
          # from "missing" against the runner's own default keychain.
          ENIGMA_TEST_LOCK_DEFAULT_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
