name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Full suite on Linux, the platform every other feature (Secret Service,
  # systemd credentials, the supervisor's SIGTERM-based shutdown contract)
  # is written and verified against.
  test:
    runs-on: ubuntu-latest
    # Every step here finishes in well under a minute; a real hang (not
    # normal variance) should fail loudly in minutes, not silently run
    # for hours against GitHub's own 360-minute default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        timeout-minutes: 3
      - run: bun run lint:ci
        timeout-minutes: 3
      - run: bun run --filter '*' check
        timeout-minutes: 3
      - run: bun test
        timeout-minutes: 5

  # macOS and Windows verify the master-key resolver and its native
  # Keychain/Credential Manager adapters for real, on real platform
  # runners. They do not yet run the full suite: the supervisor's
  # SIGTERM-based shutdown contract is POSIX-only and untracked here
  # (see the linked follow-up task) -- unrelated to master-key delivery.
  native-master-key:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # A scratch, job-owned keychain instead of the runner's real login
      # keychain: touching the login keychain (default-keychain -d user,
      # lock-keychain) has repeatedly hung/prompted in GitHub-hosted macOS
      # CI industry-wide (fastlane's own "setup_ci" exists for exactly this
      # reason). Setting our own as both default and the sole search-list
      # entry makes it the one the Keychain Services APIs under test
      # resolve to, with no relock timer and no interactive prompt.
      - name: Create scratch macOS keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p "enigma-ci" enigma-ci.keychain
          security list-keychains -d user -s enigma-ci.keychain
          security default-keychain -s enigma-ci.keychain
          security unlock-keychain -p "enigma-ci" enigma-ci.keychain
          security set-keychain-settings enigma-ci.keychain
        timeout-minutes: 2
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: bun run --filter '*' check
        timeout-minutes: 3
      - run: bun test packages/enigma/test/master-key.test.ts packages/enigma/test/native-master-key.test.ts
        timeout-minutes: 5
        env:
          # macOS-only: proves the Keychain adapter fails closed, within its own
          # bounded timeout, against the scratch keychain created above once it's
          # locked -- never the real login keychain, and never a hang.
          ENIGMA_TEST_LOCK_DEFAULT_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
          ENIGMA_TEST_KEYCHAIN_PASSWORD: enigma-ci
      - name: Remove scratch macOS keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain enigma-ci.keychain || true
        timeout-minutes: 1
