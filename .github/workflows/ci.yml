name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Full suite on Linux, the platform every other feature (Secret Service,
  # systemd credentials, the supervisor's SIGTERM-based shutdown contract)
  # is written and verified against.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test

  # macOS and Windows verify the master-key resolver and its native
  # Keychain/Credential Manager adapters for real, on real platform
  # runners. They do not yet run the full suite: the supervisor's
  # SIGTERM-based shutdown contract is POSIX-only and untracked here
  # (see the linked follow-up task) -- unrelated to master-key delivery.
  native-master-key:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun test test/master-key.test.ts test/native-master-key.test.ts
        env:
          # macOS-only: proves the Keychain adapter reports "locked" distinctly
          # from "missing" against the runner's own default keychain.
          ENIGMA_TEST_LOCK_DEFAULT_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
