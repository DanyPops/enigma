name: keychain-write-probe

# Disposable: isolates whether a bare @napi-rs/keyring Entry.setPassword()
# write to a scratch macOS keychain hangs on GitHub-hosted macos-latest,
# independent of enigma's own test scaffolding. Removed once diagnosed.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: |
          security create-keychain -p "probe" probe.keychain
          security list-keychains -d user -s probe.keychain
          security default-keychain -s probe.keychain
          security unlock-keychain -p "probe" probe.keychain
          security set-keychain-settings probe.keychain
        timeout-minutes: 1
      - run: bun install --frozen-lockfile
        timeout-minutes: 3
      - run: |
          cat > /tmp/probe.ts <<'EOF'
          import { Entry } from "@napi-rs/keyring";
          console.log("before write");
          new Entry("com.danypops.enigma.probe", "master").setPassword("x");
          console.log("after write");
          EOF
          bun /tmp/probe.ts
        timeout-minutes: 2
      - name: Lock the scratch keychain, then probe the CLI's own behavior against it
        run: |
          security lock-keychain probe.keychain
          set +e
          security find-generic-password -a master -s com.danypops.enigma.probe -w probe.keychain
          echo "exit=$?"
        timeout-minutes: 1
      - if: always()
        run: security delete-keychain probe.keychain || true
        timeout-minutes: 1
