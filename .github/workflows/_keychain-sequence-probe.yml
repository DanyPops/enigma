name: keychain-sequence-probe

# Disposable: traces every step of the real read/write/lock sequence with
# timing, against a scratch keychain built exactly like ci.yml's, to find
# exactly which call is slow/hanging. Removed once diagnosed.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: |
          security create-keychain -p "enigma-ci" enigma-ci.keychain
          security list-keychains -d user -s enigma-ci.keychain
          security default-keychain -s enigma-ci.keychain
          security unlock-keychain -p "enigma-ci" enigma-ci.keychain
          security set-keychain-settings enigma-ci.keychain
        timeout-minutes: 1
      - run: bun install --frozen-lockfile
        timeout-minutes: 3
      - run: |
          cat > /tmp/probe.ts <<'SCRIPT'
          import { Entry } from "@napi-rs/keyring";
          import { spawnSync } from "node:child_process";
          import { randomUUID } from "node:crypto";

          function step(name: string, fn: () => void) {
            const t = Date.now();
            try {
              fn();
              console.log(`OK   ${name} (${Date.now() - t}ms)`);
            } catch (e) {
              console.log(`FAIL ${name} (${Date.now() - t}ms): ${e}`);
            }
          }

          const service = `com.danypops.enigma.probe.${randomUUID()}`;
          const account = "master";

          function find() {
            return spawnSync("/usr/bin/security", ["find-generic-password", "-a", account, "-s", service, "-w"], {
              encoding: "utf8",
              timeout: 10_000,
            });
          }

          step("not-found read (before anything exists)", () => {
            const r = find();
            console.log(`  status=${r.status} signal=${r.signal} stderr=${JSON.stringify(r.stderr)} error=${r.error}`);
          });

          step("native write", () => {
            new Entry(service, account).setPassword("x");
          });

          step("read after write (should find it)", () => {
            const r = find();
            console.log(`  status=${r.status} signal=${r.signal} stdout=${JSON.stringify(r.stdout)} error=${r.error}`);
          });

          step("lock keychain", () => {
            const r = spawnSync("/usr/bin/security", ["lock-keychain", "enigma-ci.keychain"], { encoding: "utf8", timeout: 10_000 });
            console.log(`  status=${r.status}`);
          });

          step("read while locked (expected bounded failure)", () => {
            const r = find();
            console.log(`  status=${r.status} signal=${r.signal} stderr=${JSON.stringify(r.stderr)} error=${r.error}`);
          });

          step("unlock with real password", () => {
            const r = spawnSync("/usr/bin/security", ["unlock-keychain", "-p", "enigma-ci", "enigma-ci.keychain"], { encoding: "utf8", timeout: 10_000 });
            console.log(`  status=${r.status}`);
          });
          SCRIPT
          bun /tmp/probe.ts
        timeout-minutes: 3
      - if: always()
        run: security delete-keychain enigma-ci.keychain || true
        timeout-minutes: 1
