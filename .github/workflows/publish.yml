name: Publish

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). One workflow
# file, two independently tag-triggered jobs -- npmjs.com's trusted
# publisher is configured per package name (org=DanyPops repo=enigma
# workflow=publish.yml), and a package's own trust entry only cares that
# the workflow filename and repo match, not which job within it ran.
#
# @danypops/enigma:        tag "v*"
# @danypops/enigma-client: tag "enigma-client-v*"

on:
  push:
    tags:
      - "v*"
      - "enigma-client-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-enigma:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/enigma
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: .
      - run: bun run lint:ci
        working-directory: .
      - run: bun test
      - run: bun x tsc --noEmit

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      # --provenance is documented as automatic under trusted publishing, but is
      # confirmed (npm/cli#8730) to be needed explicitly in practice for the OIDC
      # exchange to actually trigger -- without it npm CLI falls back to ENEEDAUTH.
      - run: npm publish --access public --provenance

  publish-enigma-client:
    if: startsWith(github.ref, 'refs/tags/enigma-client-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/enigma-client
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: .
      - run: bun run lint:ci
        working-directory: .
      - run: bun test
      - run: bun x tsc --noEmit

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public --provenance
