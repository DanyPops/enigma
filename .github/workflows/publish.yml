name: Publish Package

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). Configure the
# trusted publisher on npmjs.com: org=DanyPops repo=enigma workflow=publish.yml

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun test
      - run: bun x tsc --noEmit

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      # Disposable diagnostic: presence only, never prints the token value itself.
      - run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "ACTIONS_ID_TOKEN_REQUEST_URL is set"; else echo "ACTIONS_ID_TOKEN_REQUEST_URL is EMPTY"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is set"; else echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is EMPTY"; fi

      # --provenance is documented as automatic under trusted publishing, but is
      # confirmed (npm/cli#8730) to be needed explicitly in practice for the OIDC
      # exchange to actually trigger -- without it npm CLI falls back to ENEEDAUTH.
      - run: npm publish --access public --provenance
